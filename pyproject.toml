[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-ai-full"
version = "1.0.0"
description = "Complete 4-Layer Drone AI System: Manager, PathFinder, Perception, FlyControl"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Drone AI Team"}
]
keywords = ["drone", "ai", "reinforcement-learning", "robotics", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
    "gymnasium>=0.28.0",
    "torch>=2.0.0",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
training = [
    "stable-baselines3>=2.0.0",
    "tensorboard>=2.10.0",
    "wandb>=0.15.0",
]
visualization = [
    "matplotlib>=3.5.0",
    "pygame>=2.1.0",
]
all = [
    "drone-ai-full[dev,training,visualization]",
]

[project.scripts]
drone-ai = "drone_ai.cli:main"

[project.urls]
Homepage = "https://github.com/catlandia/drone-AI-full"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drone_ai = ["*.json", "*.yaml"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
